<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng Ký - Nhận Diện Trái Cây</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="container" style="max-width: 500px; margin-top: 80px;">
    <div class="card">
      <div class="text-center mb-3">
        <div class="logo-icon" style="font-size: 64px;">🍎</div>
        <h1 style="color: var(--primary-color); margin-top: 10px;">Đăng Ký Tài Khoản</h1>
        <p style="color: var(--grey);">Tạo tài khoản mới để sử dụng hệ thống</p>
      </div>

      <form id="register-form">
        <div class="form-group">
          <label class="form-label">Họ và tên</label>
          <input 
            type="text" 
            class="form-control" 
            id="fullname" 
            placeholder="Nhập họ và tên"
            required
          >
          <div class="form-error" id="fullname-error"></div>
        </div>

        <div class="form-group">
          <label class="form-label">Tên đăng nhập</label>
          <input 
            type="text" 
            class="form-control" 
            id="username" 
            placeholder="Nhập tên đăng nhập (3-50 ký tự)"
            required
          >
          <div class="form-error" id="username-error"></div>
        </div>

        <div class="form-group">
          <label class="form-label">Email</label>
          <input 
            type="email" 
            class="form-control" 
            id="email" 
            placeholder="Nhập email"
            required
          >
          <div class="form-error" id="email-error"></div>
        </div>

        <div class="form-group">
          <label class="form-label">Mật khẩu</label>
          <input 
            type="password" 
            class="form-control" 
            id="password" 
            placeholder="Nhập mật khẩu (tối thiểu 6 ký tự)"
            required
          >
          <div class="form-error" id="password-error"></div>
        </div>

        <div class="form-group">
          <label class="form-label">Xác nhận mật khẩu</label>
          <input 
            type="password" 
            class="form-control" 
            id="confirm-password" 
            placeholder="Nhập lại mật khẩu"
            required
          >
          <div class="form-error" id="confirm-password-error"></div>
        </div>

        <button type="submit" class="btn btn-primary btn-block btn-lg">
          Đăng Ký
        </button>
      </form>

      <div class="text-center mt-3">
        <p style="color: var(--grey);">
          Đã có tài khoản? 
          <a href="login.html" style="color: var(--primary-color); font-weight: bold;">
            Đăng nhập ngay
          </a>
        </p>
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/utils.js"></script>
  <script>
    // Redirect nếu đã đăng nhập
    redirectIfAuthenticated();

    // Xử lý form đăng ký
    document.getElementById('register-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const fullname = document.getElementById('fullname').value.trim();
      const username = document.getElementById('username').value.trim();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirm-password').value;
      
      // Reset errors
      document.querySelectorAll('.form-error').forEach(el => el.textContent = '');
      
      // Validate
      let hasError = false;
      
      if (fullname.length < 2) {
        document.getElementById('fullname-error').textContent = 
          'Họ tên phải có ít nhất 2 ký tự';
        hasError = true;
      }
      
      if (!validateUsername(username)) {
        document.getElementById('username-error').textContent = 
          'Tên đăng nhập phải từ 3-50 ký tự';
        hasError = true;
      }
      
      if (!validateEmail(email)) {
        document.getElementById('email-error').textContent = 
          'Email không hợp lệ';
        hasError = true;
      }
      
      if (!validatePassword(password)) {
        document.getElementById('password-error').textContent = 
          'Mật khẩu phải có ít nhất 6 ký tự';
        hasError = true;
      }
      
      if (password !== confirmPassword) {
        document.getElementById('confirm-password-error').textContent = 
          'Mật khẩu xác nhận không khớp';
        hasError = true;
      }
      
      if (hasError) return;
      
      // Đăng ký
      try {
        showLoading('Đang đăng ký...');
        
        await apiService.register(username, email, password, fullname);
        
        hideLoading();
        showAlert('Đăng ký thành công! Đang chuyển đến trang đăng nhập...', 'success');
        
        // Redirect sau 2 giây
        setTimeout(() => {
          window.location.href = 'login.html';
        }, 2000);
        
      } catch (error) {
        hideLoading();
        showAlert(error.message || 'Đăng ký thất bại', 'error');
      }
    });
  </script>
</body>
</html>
