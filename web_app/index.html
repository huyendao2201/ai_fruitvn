<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nhận Diện Trái Cây - Trang Chủ</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .upload-area {
      border: 3px dashed #667eea;
      border-radius: 20px;
      padding: 60px 20px;
      text-align: center;
      cursor: pointer;
      transition: all 0.3s ease;
      background: linear-gradient(135deg, rgba(102, 126, 234, 0.05) 0%, rgba(118, 75, 162, 0.05) 100%);
    }
    
    .upload-area:hover {
      border-color: #764ba2;
      background: linear-gradient(135deg, rgba(102, 126, 234, 0.1) 0%, rgba(118, 75, 162, 0.1) 100%);
      transform: translateY(-2px);
      box-shadow: 0 10px 30px rgba(102, 126, 234, 0.2);
    }
    
    .upload-area.dragover {
      border-color: #764ba2;
      background: linear-gradient(135deg, rgba(102, 126, 234, 0.15) 0%, rgba(118, 75, 162, 0.15) 100%);
      transform: scale(1.02);
    }
    
    .upload-icon {
      font-size: 80px;
      animation: float 3s ease-in-out infinite;
    }
    
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }
    
    .preview-container {
      max-width: 600px;
      margin: 0 auto;
      position: relative;
      overflow: hidden;
      border-radius: 20px;
    }
    
    .preview-image {
      width: 100%;
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      transition: transform 0.3s ease;
    }
    
    .preview-image:hover {
      transform: scale(1.02);
    }
    
    .result-card {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 40px;
      border-radius: 25px;
      text-align: center;
      box-shadow: 0 20px 60px rgba(102, 126, 234, 0.4);
      animation: slideUp 0.5s ease;
    }
    
    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    
    .result-emoji {
      font-size: 100px;
      animation: zoomIn 0.5s ease;
    }
    
    @keyframes zoomIn {
      from {
        transform: scale(0);
      }
      to {
        transform: scale(1);
      }
    }
    
    .confidence-bar {
      background-color: rgba(255, 255, 255, 0.3);
      height: 40px;
      border-radius: 20px;
      overflow: hidden;
      margin-top: 15px;
      box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.2);
    }
    
    .confidence-fill {
      background: linear-gradient(90deg, #4CAF50 0%, #8BC34A 100%);
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 18px;
      color: white;
      transition: width 1.5s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 2px 10px rgba(76, 175, 80, 0.5);
    }
    
    .feedback-btn-group {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
      margin-bottom: 25px;
    }
    
    .feedback-btn-group .btn {
      padding: 15px;
      font-size: 18px;
      border-radius: 15px;
      transition: all 0.3s ease;
    }
    
    .feedback-btn-group .btn:hover:not(:disabled) {
      transform: translateY(-3px);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
    }
  </style>
</head>
<body>
  <!-- Header -->
  <header class="header">
    <div class="container">
      <div class="header-content">
        <a href="index.html" class="logo">
          <span class="logo-icon">🍎</span>
          <span>Nhận Diện Trái Cây</span>
        </a>
        
        <button class="menu-toggle" id="menu-toggle">☰</button>
        
        <nav class="nav" id="nav-menu">
          <a href="index.html" class="nav-link active">Trang Chủ</a>
          <a href="history.html" class="nav-link">Lịch Sử</a>
          <a href="#" class="nav-link" id="admin-link" style="display: none;">Quản Trị</a>
          <div class="user-info">
            <div class="user-avatar" id="user-avatar">U</div>
            <span id="user-name">User</span>
          </div>
          <button class="btn btn-sm btn-outline" id="logout-btn" style="color: white; border-color: white;">
            Đăng Xuất
          </button>
        </nav>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="container" style="margin-top: 40px; margin-bottom: 40px;">
    <!-- Upload Section -->
    <div id="upload-section">
      <div class="card">
        <h2 class="card-header" style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;">
          📷 Nhận Diện Trái Cây
        </h2>
        
        <div class="upload-area" id="upload-area">
          <div class="upload-icon">📸</div>
          <h3 style="margin-bottom: 10px; color: #667eea;">Chọn hoặc kéo thả hình ảnh</h3>
          <p style="color: var(--grey); margin-bottom: 25px; font-size: 15px;">
            Hỗ trợ: JPG, JPEG, PNG (tối đa 10MB)
          </p>
          <button class="btn btn-primary btn-lg" id="select-file-btn" style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); border: none; padding: 15px 40px; border-radius: 15px; font-size: 18px;">
            📁 Chọn Hình Ảnh
          </button>
          <input 
            type="file" 
            id="file-input" 
            accept="image/jpeg,image/jpg,image/png" 
            style="display: none;"
          >
        </div>
      </div>
    </div>

    <!-- Preview & Result Section -->
    <div id="result-section" style="display: none;">
      <!-- Image Preview -->
      <div class="card mb-3">
        <h3 class="card-header" style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;">
          🖼️ Hình Ảnh Đã Chọn
        </h3>
        <div class="preview-container">
          <img id="preview-image" class="preview-image" alt="Preview">
        </div>
        <div class="card-footer text-center" style="padding-top: 25px;">
          <button class="btn btn-secondary" id="change-image-btn" style="border-radius: 12px; padding: 12px 30px;">
            🔄 Chọn Ảnh Khác
          </button>
          <button class="btn btn-primary btn-lg" id="predict-btn" style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); border: none; padding: 15px 40px; border-radius: 15px; font-size: 18px;">
            🔍 Nhận Diện Ngay
          </button>
        </div>
      </div>

      <!-- Prediction Result -->
      <div id="prediction-result" style="display: none;">
        <div class="result-card mb-3">
          <div class="result-emoji" id="result-emoji">🍎</div>
          <h2 style="margin-bottom: 10px; font-size: 24px; opacity: 0.9;">Kết Quả Nhận Diện</h2>
          <h1 style="font-size: 42px; margin-bottom: 25px; font-weight: bold;" id="result-name">
            Xoài Cát Hòa Lộc
          </h1>
          
          <div style="background-color: rgba(255, 255, 255, 0.15); padding: 25px; border-radius: 20px; backdrop-filter: blur(10px);">
            <h3 style="margin-bottom: 15px; font-size: 20px;">Độ Tin Cậy</h3>
            <div class="confidence-bar">
              <div class="confidence-fill" id="confidence-fill" style="width: 0%;">
                <span id="confidence-text">0%</span>
              </div>
            </div>
          </div>
        </div>

        <!-- Feedback Section -->
        <div class="card">
          <h3 class="card-header" style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;">
            💬 Phản Hồi
          </h3>
          <p style="margin-bottom: 25px; color: var(--grey); font-size: 16px;">
            Kết quả có chính xác không? Hãy cho chúng tôi biết!
          </p>
          
          <div class="feedback-btn-group">
            <button class="btn btn-primary" id="correct-btn" style="background: linear-gradient(135deg, #4CAF50 0%, #8BC34A 100%); border: none;">
              ✓ Chính Xác
            </button>
            <button class="btn btn-danger" id="incorrect-btn" style="background: linear-gradient(135deg, #F44336 0%, #E91E63 100%); border: none;">
              ✗ Không Chính Xác
            </button>
          </div>

          <div id="comment-section" style="display: none;">
            <div class="form-group">
              <label class="form-label" style="font-weight: 600; font-size: 16px;">Nhận xét (tùy chọn)</label>
              <textarea 
                class="form-control" 
                id="comment-input" 
                placeholder="Nhập nhận xét của bạn..."
                rows="4"
                style="border-radius: 12px;"
              ></textarea>
            </div>
            <button class="btn btn-secondary btn-block" id="submit-feedback-btn" style="border-radius: 12px; padding: 12px; font-size: 16px;">
              📤 Gửi Phản Hồi
            </button>
          </div>
        </div>

        <!-- Actions -->
        <div class="text-center mt-3">
          <button class="btn btn-outline btn-lg" id="new-prediction-btn" style="border-radius: 15px; padding: 15px 40px; font-size: 18px; border-width: 2px;">
            🔄 Nhận Diện Ảnh Mới
          </button>
        </div>
      </div>
    </div>
  </main>

  <script src="js/api.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
