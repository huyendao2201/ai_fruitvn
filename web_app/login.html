<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng Nhập - Nhận Diện Trái Cây</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    body {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    .login-container {
      max-width: 450px;
      width: 100%;
      padding: 20px;
    }
    
    .login-card {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      padding: 40px;
      animation: fadeIn 0.5s ease;
    }
    
    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(-20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    
    .logo-icon {
      font-size: 80px;
      animation: bounce 2s infinite;
    }
    
    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }
    
    .demo-card {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border-radius: 15px;
      padding: 20px;
      margin-top: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
    }
    
    .demo-card code {
      background: rgba(255, 255, 255, 0.2);
      padding: 2px 8px;
      border-radius: 4px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="login-card">
      <div class="text-center mb-3">
        <div class="logo-icon">🍎</div>
        <h1 style="color: #667eea; margin-top: 10px; font-size: 32px;">Nhận Diện Trái Cây</h1>
        <p style="color: var(--grey); font-size: 16px;">Đăng nhập để sử dụng hệ thống</p>
      </div>

      <form id="login-form">
        <div class="form-group">
          <label class="form-label">Tên đăng nhập</label>
          <input 
            type="text" 
            class="form-control" 
            id="username" 
            placeholder="Nhập tên đăng nhập"
            required
            autocomplete="username"
          >
          <div class="form-error" id="username-error"></div>
        </div>

        <div class="form-group">
          <label class="form-label">Mật khẩu</label>
          <input 
            type="password" 
            class="form-control" 
            id="password" 
            placeholder="Nhập mật khẩu"
            required
            autocomplete="current-password"
          >
          <div class="form-error" id="password-error"></div>
        </div>

        <button type="submit" class="btn btn-primary btn-block btn-lg" style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); border: none;">
          🔐 Đăng Nhập
        </button>
      </form>

      <div class="text-center mt-3">
        <p style="color: var(--grey);">
          Chưa có tài khoản? 
          <a href="register.html" style="color: #667eea; font-weight: bold; text-decoration: none;">
            Đăng ký ngay
          </a>
        </p>
      </div>
    </div>

    <!-- Demo accounts info -->
    <div class="demo-card">
      <h4 style="margin-bottom: 15px; font-size: 18px;">🔑 Tài khoản demo</h4>
      <div style="display: grid; gap: 15px;">
        <div>
          <strong>👨‍💼 Admin:</strong><br>
          Username: <code>admin</code><br>
          Password: <code>admin123</code>
        </div>
        <div>
          <strong>👤 User:</strong><br>
          Username: <code>user1</code><br>
          Password: <code>password123</code>
        </div>
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/utils.js"></script>
  <script>
    // Redirect nếu đã đăng nhập
    redirectIfAuthenticated();

    // Xử lý form đăng nhập
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      
      // Reset errors
      document.getElementById('username-error').textContent = '';
      document.getElementById('password-error').textContent = '';
      
      // Validate
      if (!validateUsername(username)) {
        document.getElementById('username-error').textContent = 
          'Tên đăng nhập phải từ 3-50 ký tự';
        return;
      }
      
      if (!validatePassword(password)) {
        document.getElementById('password-error').textContent = 
          'Mật khẩu phải có ít nhất 6 ký tự';
        return;
      }
      
      // Đăng nhập
      try {
        showLoading('Đang đăng nhập...');
        
        const data = await apiService.login(username, password);
        
        hideLoading();
        showAlert('Đăng nhập thành công! 🎉', 'success');
        
        // Redirect sau 1 giây
        setTimeout(() => {
          window.location.href = 'index.html';
        }, 1000);
        
      } catch (error) {
        hideLoading();
        console.error('Login error:', error);
        showAlert(error.message || 'Đăng nhập thất bại. Vui lòng kiểm tra lại thông tin!', 'error');
      }
    });
  </script>
</body>
</html>
