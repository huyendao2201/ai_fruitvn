<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lịch Sử Dự Đoán - Nhận Diện Trái Cây</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .history-item {
      display: grid;
      grid-template-columns: 150px 1fr auto;
      gap: 20px;
      padding: 20px;
      border-bottom: 1px solid var(--light-grey);
      transition: background-color var(--transition-fast);
    }
    
    .history-item:hover {
      background-color: var(--light-grey);
    }
    
    .history-item:last-child {
      border-bottom: none;
    }
    
    .history-image {
      width: 150px;
      height: 150px;
      object-fit: cover;
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-sm);
    }
    
    .history-info {
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 8px;
    }
    
    .history-actions {
      display: flex;
      flex-direction: column;
      gap: 8px;
      align-items: flex-end;
      justify-content: center;
    }
    
    .badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: bold;
    }
    
    .badge-success {
      background-color: #e8f5e9;
      color: #2e7d32;
    }
    
    .badge-warning {
      background-color: #fff3e0;
      color: #e65100;
    }
    
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--grey);
    }
    
    @media (max-width: 768px) {
      .history-item {
        grid-template-columns: 1fr;
        gap: 15px;
      }
      
      .history-image {
        width: 100%;
        height: 200px;
      }
      
      .history-actions {
        flex-direction: row;
        justify-content: flex-start;
      }
    }
  </style>
</head>
<body>
  <!-- Header -->
  <header class="header">
    <div class="container">
      <div class="header-content">
        <a href="index.html" class="logo">
          <span class="logo-icon">🍎</span>
          <span>Nhận Diện Trái Cây</span>
        </a>
        
        <button class="menu-toggle" id="menu-toggle">☰</button>
        
        <nav class="nav" id="nav-menu">
          <a href="index.html" class="nav-link">Trang Chủ</a>
          <a href="history.html" class="nav-link active">Lịch Sử</a>
          <a href="#" class="nav-link" id="admin-link" style="display: none;">Quản Trị</a>
          <div class="user-info">
            <div class="user-avatar" id="user-avatar">U</div>
            <span id="user-name">User</span>
          </div>
          <button class="btn btn-sm btn-outline" id="logout-btn" style="color: white; border-color: white;">
            Đăng Xuất
          </button>
        </nav>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="container" style="margin-top: 40px; margin-bottom: 40px;">
    <div class="card">
      <div class="card-header" style="display: flex; justify-content: space-between; align-items: center;">
        <h2>📜 Lịch Sử Dự Đoán</h2>
        <button class="btn btn-secondary btn-sm" id="refresh-btn">
          🔄 Làm Mới
        </button>
      </div>

      <!-- Loading State -->
      <div id="loading-state" style="text-align: center; padding: 40px;">
        <div class="spinner" style="margin: 0 auto;"></div>
        <p style="margin-top: 20px; color: var(--grey);">Đang tải...</p>
      </div>

      <!-- Empty State -->
      <div id="empty-state" class="empty-state" style="display: none;">
        <div style="font-size: 64px; margin-bottom: 20px;">📭</div>
        <h3>Chưa có lịch sử</h3>
        <p style="margin-bottom: 20px;">Bạn chưa thực hiện nhận diện nào</p>
        <a href="index.html" class="btn btn-primary">
          Nhận Diện Ngay
        </a>
      </div>

      <!-- History List -->
      <div id="history-list"></div>

      <!-- Pagination -->
      <div id="pagination-container"></div>
    </div>
  </main>

  <!-- Detail Modal -->
  <div id="detail-modal" style="display: none;">
    <!-- Will be populated by JavaScript -->
  </div>

  <script src="js/api.js"></script>
  <script src="js/utils.js"></script>
  <script>
    // Check authentication
    requireAuth();

    // State
    let currentPage = 1;
    const perPage = 10;

    // DOM Elements
    const loadingState = document.getElementById('loading-state');
    const emptyState = document.getElementById('empty-state');
    const historyList = document.getElementById('history-list');
    const paginationContainer = document.getElementById('pagination-container');
    const menuToggle = document.getElementById('menu-toggle');
    const navMenu = document.getElementById('nav-menu');
    const logoutBtn = document.getElementById('logout-btn');
    const refreshBtn = document.getElementById('refresh-btn');

    // Initialize
    document.addEventListener('DOMContentLoaded', () => {
      initializeUser();
      setupEventListeners();
      loadHistory();
    });

    /**
     * Initialize user info
     */
    function initializeUser() {
      const user = apiService.getCurrentUser();
      
      if (user) {
        document.getElementById('user-name').textContent = user.full_name || user.username;
        document.getElementById('user-avatar').textContent = 
          (user.full_name || user.username).charAt(0).toUpperCase();
        
        // Show admin link if admin
        if (apiService.isAdmin()) {
          document.getElementById('admin-link').style.display = 'block';
          document.getElementById('admin-link').href = 'pages/admin.html';
        }
      }
    }

    /**
     * Setup event listeners
     */
    function setupEventListeners() {
      // Mobile menu toggle
      menuToggle.addEventListener('click', () => {
        navMenu.classList.toggle('active');
      });
      
      // Logout
      logoutBtn.addEventListener('click', () => {
        showConfirm('Bạn có chắc muốn đăng xuất?', () => {
          apiService.logout();
        });
      });
      
      // Refresh
      refreshBtn.addEventListener('click', () => {
        loadHistory();
      });
    }

    /**
     * Load history
     */
    async function loadHistory(page = 1) {
      currentPage = page;
      
      try {
        // Show loading
        loadingState.style.display = 'block';
        emptyState.style.display = 'none';
        historyList.innerHTML = '';
        paginationContainer.innerHTML = '';
        
        const data = await apiService.getPredictionHistory(page, perPage);
        
        // Hide loading
        loadingState.style.display = 'none';
        
        if (data.predictions.length === 0) {
          emptyState.style.display = 'block';
          return;
        }
        
        // Display history items
        data.predictions.forEach(prediction => {
          historyList.appendChild(createHistoryItem(prediction));
        });
        
        // Display pagination
        if (data.total_pages > 1) {
          paginationContainer.appendChild(
            createPagination(data.current_page, data.total_pages, loadHistory)
          );
        }
        
      } catch (error) {
        loadingState.style.display = 'none';
        showAlert(error.message || 'Tải lịch sử thất bại', 'error');
      }
    }

    /**
     * Create history item element
     */
    function createHistoryItem(prediction) {
      const item = document.createElement('div');
      item.className = 'history-item fade-in';
      
      const fruitName = getVietnameseName(prediction.predicted_label);
      const fruitEmoji = getFruitEmoji(prediction.predicted_label);
      const confidence = Math.round(prediction.confidence * 100);
      const imageUrl = getImageUrl(prediction.image_path);
      
      // Feedback badge
      let feedbackBadge = '';
      if (prediction.feedback) {
        if (prediction.feedback.is_correct) {
          feedbackBadge = '<span class="badge badge-success">✓ Chính xác</span>';
        } else {
          feedbackBadge = '<span class="badge badge-warning">✗ Không chính xác</span>';
        }
      }
      
      item.innerHTML = `
        <img src="${imageUrl}" alt="${fruitName}" class="history-image">
        
        <div class="history-info">
          <div style="display: flex; align-items: center; gap: 10px;">
            <span style="font-size: 32px;">${fruitEmoji}</span>
            <div>
              <h3 style="margin: 0;">${fruitName}</h3>
              <p style="margin: 0; color: var(--grey); font-size: 14px;">
                Độ tin cậy: ${confidence}%
              </p>
            </div>
          </div>
          
          <div style="display: flex; gap: 10px; align-items: center;">
            <span style="color: var(--grey); font-size: 14px;">
              🕐 ${formatDateTime(prediction.created_at)}
            </span>
            ${feedbackBadge}
          </div>
          
          ${prediction.feedback && prediction.feedback.comment ? `
            <div style="background-color: var(--light-grey); padding: 10px; border-radius: var(--radius-sm); font-size: 14px;">
              💬 ${prediction.feedback.comment}
            </div>
          ` : ''}
        </div>
        
        <div class="history-actions">
          <button class="btn btn-sm btn-outline" onclick="viewDetail(${prediction.id})">
            👁️ Chi Tiết
          </button>
          <button class="btn btn-sm btn-danger" onclick="deleteItem(${prediction.id})">
            🗑️ Xóa
          </button>
        </div>
      `;
      
      return item;
    }

    /**
     * View detail
     */
    async function viewDetail(predictionId) {
      try {
        showLoading('Đang tải chi tiết...');
        
        const prediction = await apiService.getPredictionDetail(predictionId);
        
        hideLoading();
        
        // Show detail modal
        showDetailModal(prediction);
        
      } catch (error) {
        hideLoading();
        showAlert(error.message || 'Tải chi tiết thất bại', 'error');
      }
    }

    /**
     * Show detail modal
     */
    function showDetailModal(prediction) {
      const fruitName = getVietnameseName(prediction.predicted_label);
      const fruitEmoji = getFruitEmoji(prediction.predicted_label);
      const confidence = Math.round(prediction.confidence * 100);
      const imageUrl = getImageUrl(prediction.image_path);
      
      const modal = document.createElement('div');
      modal.className = 'loading-overlay';
      modal.style.backgroundColor = 'rgba(0, 0, 0, 0.8)';
      
      modal.innerHTML = `
        <div class="card" style="max-width: 600px; max-height: 90vh; overflow-y: auto;">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <h2>Chi Tiết Dự Đoán</h2>
            <button class="btn btn-sm" onclick="this.closest('.loading-overlay').remove()">✕</button>
          </div>
          
          <img src="${imageUrl}" alt="${fruitName}" style="width: 100%; border-radius: var(--radius-md); margin-bottom: 20px;">
          
          <div style="text-align: center; margin-bottom: 20px;">
            <div style="font-size: 48px; margin-bottom: 10px;">${fruitEmoji}</div>
            <h2 style="margin-bottom: 10px;">${fruitName}</h2>
            <p style="color: var(--grey);">Độ tin cậy: ${confidence}%</p>
          </div>
          
          <div style="background-color: var(--light-grey); padding: 15px; border-radius: var(--radius-md); margin-bottom: 20px;">
            <p style="margin: 0;"><strong>ID:</strong> ${prediction.id}</p>
            <p style="margin: 0;"><strong>Thời gian:</strong> ${formatDateTime(prediction.created_at)}</p>
            <p style="margin: 0;"><strong>Label:</strong> ${prediction.predicted_label}</p>
          </div>
          
          ${prediction.feedback ? `
            <div style="border-top: 1px solid var(--light-grey); padding-top: 15px;">
              <h3>Phản Hồi</h3>
              <p>
                ${prediction.feedback.is_correct 
                  ? '<span class="badge badge-success">✓ Chính xác</span>' 
                  : '<span class="badge badge-warning">✗ Không chính xác</span>'}
              </p>
              ${prediction.feedback.comment ? `
                <div style="background-color: var(--light-grey); padding: 10px; border-radius: var(--radius-sm);">
                  ${prediction.feedback.comment}
                </div>
              ` : ''}
            </div>
          ` : ''}
        </div>
      `;
      
      document.body.appendChild(modal);
    }

    /**
     * Delete item
     */
    async function deleteItem(predictionId) {
      showConfirm('Bạn có chắc muốn xóa dự đoán này?', async () => {
        try {
          showLoading('Đang xóa...');
          
          await apiService.deletePrediction(predictionId);
          
          hideLoading();
          showAlert('Đã xóa thành công', 'success');
          
          // Reload history
          loadHistory(currentPage);
          
        } catch (error) {
          hideLoading();
          showAlert(error.message || 'Xóa thất bại', 'error');
        }
      });
    }
  </script>
</body>
</html>
